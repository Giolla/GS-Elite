name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to deploy (e.g. v1.0.0)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      # --- Build steps: only on tag push ---
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          ref: ${{ github.ref_name }}

      - name: Make Maven Wrapper executable
        if: github.event_name == 'push'
        run: chmod +x mvnw

      - name: Set up Java 21
        if: github.event_name == 'push'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Stamp version and test
        if: github.event_name == 'push'
        run: |
          ./mvnw versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false
          ./mvnw test

      # --- Auth: always ---
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # --- Build and push image: only on tag push ---
      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev
          docker build -t us-central1-docker.pkg.dev/elite-giolla/elite-api/elite-api:${{ env.VERSION }} .
          docker tag us-central1-docker.pkg.dev/elite-giolla/elite-api/elite-api:${{ env.VERSION }} \
                     us-central1-docker.pkg.dev/elite-giolla/elite-api/elite-api:latest
          docker push us-central1-docker.pkg.dev/elite-giolla/elite-api/elite-api:${{ env.VERSION }}
          docker push us-central1-docker.pkg.dev/elite-giolla/elite-api/elite-api:latest

      # --- Verify image exists: only on manual deploy ---
      - name: Verify image exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          IMAGE="us-central1-docker.pkg.dev/elite-giolla/elite-api/elite-api:${{ env.VERSION }}"
          if ! gcloud artifacts docker images describe "$IMAGE" >/dev/null 2>&1; then
            echo "::error::Image $IMAGE not found in Artifact Registry. Has tag ${{ env.VERSION }} ever been built?"
            exit 1
          fi
          echo "Found $IMAGE — proceeding with deploy."

      # --- Deploy: always ---
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy elite-api \
            --image us-central1-docker.pkg.dev/elite-giolla/elite-api/elite-api:${{ env.VERSION }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --memory 512Mi \
            --port 8080 \
            --set-env-vars SPRING_PROFILES_ACTIVE=prod \
            --set-secrets FIREBASE_SERVICE_ACCOUNT_JSON=elite-api-firebase-key:latest

      - name: Smoke test
        id: smoke
        run: |
          URL=$(gcloud run services describe elite-api --region us-central1 --format="value(status.url)")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/ships")
          echo "Smoke test status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed — triggering rollback"
            exit 1
          fi

      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          PREV=$(gcloud run revisions list --service elite-api --region us-central1 --format="value(name)" --sort-by="~createTime" --limit=2 | tail -1)
          echo "Rolling back to $PREV"
          gcloud run services update-traffic elite-api --region us-central1 --to-revisions "$PREV=100"
